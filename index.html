// ระบบดักจับการสแกนบาร์โค้ดจากเครื่อง Scanner (USB/Bluetooth) อัตโนมัติทั่วหน้าเว็บ
let barcodeBuffer = '';
let barcodeTimer = null;
window.addEventListener('keydown', (e) => {
  if (['INPUT', 'TEXTAREA', 'SELECT'].includes(document.activeElement.tagName)) return;
  if (e.key === 'Enter') {
    if (barcodeBuffer.trim().length > 1) {
      handleBarCodeScanResult(barcodeBuffer.trim());
    }
    barcodeBuffer = '';
    return;
  }
  if (e.key.length === 1) {
    barcodeBuffer += e.key;
    clearTimeout(barcodeTimer);
    barcodeTimer = setTimeout(() => { barcodeBuffer = ''; }, 150);
  }
});

function handleBarCodeScanResult(codeText) {
  const allProds = prods();
  const found = allProds.find(p => (p.code && p.code.toLowerCase() === codeText.toLowerCase()) || String(p.id) === codeText);
  if (found) {
    addC(found.id, false, 1);
    toast(`ສະແກນສິນຄ້າສຳເລັດ: ${ln(found.n)}`);
  } else {
    toast(`ບໍ່ພົບສິນຄ້ານี้ในລະບົບ: ${codeText}`, true);
  }
}

 pill=(f,l,on)=>`<button onclick="${f}" class="px-3 py-1 rounded-full text-xs font-bold ${on?'bg-emerald-500 text-white':'bg-gray-100 text-gray-500'}">${l}</button>`;

const PN={
profile:u=>inp('f_n',t('name'),u.name)+`<label class="block text-xs text-gray-500 mb-2">${t('gender')}<select id="f_g" class="w-full border rounded-xl p-2.5 text-sm text-gray-800 mt-1 bg-white">${[['','—'],['m',t('male')],['f',t('female')],['o',t('other')]].map(([v,l])=>`<option value="${v}" ${u.gender===v?'selected':''}>${l}</option>`).join('')}</select></label>`+inp('f_d',t('dob'),u.dob,'date')+btn('saveP()',t('save')),
priv:u=>`<div class="py-2.5"><p class="text-sm mb-2">${t('pdpa')}</p><div class="flex gap-2">${pill("upd('pdpa','in','priv')",t('accept'),u.pdpa==='in')}${pill("upd('pdpa','out','priv')",t('decline'),u.pdpa==='out')}</div></div>`};

function pn(k){openM(`${XB}<h3 class="font-bold mb-3">${t(k)}</h3>`+PN[k](U()||{}))}

function saveP(){
  const user = U() || {};
  const updatedName = $('#f_n').value.trim();
  const updatedGender = $('#f_g').value;
  const updatedDob = $('#f_d').value;
  setU({ ...user, name: updatedName, gender: updatedGender, dob: updatedDob });
  closeM(); render(); toast(t('ok'));
}

const chatAll=()=>db.get('apx_chat',{}),
 chatUn=()=>{const u=U();return u?((chatAll()[u.contact]||{}).msgs||[]).filter(m=>m.f==='a'&&!m.r).length:0},
 bub=m=>`<div class="flex ${m.f==='c'?'justify-end':''}"><div class="max-w-[80%] rounded-2xl px-3 py-2 text-sm ${m.f==='c'?'bg-emerald-600 text-white':'bg-gray-100'}"><p class="whitespace-pre-wrap break-words">${esc(m.t)}</p><span class="block text-[10px] mt-0.5 ${m.f==='c'?'text-emerald-100':'text-gray-400'}">${new Date(m.at).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})}</span></div></div>`,
 chatMsgs=()=>{const u=U();const m=(chatAll()[(u&&u.contact)||'']||{msgs:[]}).msgs;return m.length?m.map(bub).join(''):`<p class="text-center text-xs text-gray-400 py-10">${t('chatEmpty')}</p>`};
function chatRead(){const u=U(),a=chatAll();if(!u)return;const c=a[u.contact];if(c&&c.msgs.some(m=>m.f==='a'&&!m.r)){c.msgs.forEach(m=>{if(m.f==='a')m.r=1});db.set('apx_chat',a)}}
function chatBadge(){const n=chatUn();$('#chat').innerHTML='<i class="fa-solid fa-comments text-xl"></i>'+(n?`<b class="absolute -top-1 -right-1 bg-red-600 text-white text-[10px] rounded-full w-5 h-5 flex items-center justify-center">${n}</b>`:'')}
function sendC(){const u=U();if(!u)return;const i=$('#cin'),x=i.value.trim();if(!x)return;const a=chatAll(),c=a[u.contact]||(a[u.contact]={name:'',msgs:[]});c.name=u.name||u.contact;c.msgs.push({f:'c',t:x,at:Date.now(),r:0});db.set('apx_chat',a);render();const n=$('#cin');if(n&&n.focus)n.focus()}

window.addEventListener('storage', e => {
    if (e.key === 'apx_cats' && cur === 'home') {
        render();
    }
});
render();
</script></body></html>
